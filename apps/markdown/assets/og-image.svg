<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#D4A843" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0C0C0E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181D"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0C0C0E"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#1E1E24" stroke-width="2"/>
  
  <!-- Pill -->
  <g transform="translate(80, 75)">
    <rect width="210" height="36" rx="18" fill="#141418" stroke="#D4A843" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="4" fill="#D4A843"/>
    <text x="34" y="23" fill="#D4A843" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">OPENMAUS SUITE</text>
  </g>

  <!-- Title -->
  <text x="80" y="185" fill="#F2F2F0" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">
    Tools<tspan fill="#D4A843">.</tspan>io
  </text>
  <text x="80" y="245" fill="#8A8A94" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
    Herramientas simples. Potencia inmediata para productividad y derecho.
  </text>

  <!-- 3 App Cards Preview -->
  <g transform="translate(80, 310)">
    <!-- Card 1 -->
    <rect width="320" height="180" rx="16" fill="url(#cardGrad)" stroke="#1E1E24" stroke-width="1.5"/>
    <text x="24" y="55" font-size="28">⚖️</text>
    <text x="64" y="52" fill="#F2F2F0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">Códigos AR</text>
    <text x="24" y="90" fill="#8A8A94" font-family="system-ui, -apple-system, sans-serif" font-size="13">Búsqueda de +7.500 artículos</text>
    <text x="24" y="112" fill="#8A8A94" font-family="system-ui, -apple-system, sans-serif" font-size="13">Constitución, CCyC, CPen con IA</text>
    <rect x="24" y="135" width="80" height="22" rx="6" fill="#D4A843" fill-opacity="0.12"/>
    <text x="34" y="150" fill="#D4A843" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">LEGAL TECH</text>

    <!-- Card 2 -->
    <g transform="translate(360, 0)">
      <rect width="320" height="180" rx="16" fill="url(#cardGrad)" stroke="#1E1E24" stroke-width="1.5"/>
      <text x="24" y="55" font-size="28">📖</text>
      <text x="64" y="52" fill="#F2F2F0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">Citas APA</text>
      <text x="24" y="90" fill="#8A8A94" font-family="system-ui, -apple-system, sans-serif" font-size="13">Generador bibliográfico APA 7</text>
      <text x="24" y="112" fill="#8A8A94" font-family="system-ui, -apple-system, sans-serif" font-size="13">Extracción automática por URL</text>
      <rect x="24" y="135" width="84" height="22" rx="6" fill="#22C55E" fill-opacity="0.12"/>
      <text x="34" y="150" fill="#22C55E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">ACADÉMICO</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(720, 0)">
      <rect width="320" height="180" rx="16" fill="url(#cardGrad)" stroke="#1E1E24" stroke-width="1.5"/>
      <text x="24" y="55" font-size="28">💰</text>
      <text x="64" y="52" fill="#F2F2F0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">FinanzAR</text>
      <text x="24" y="90" fill="#8A8A94" font-family="system-ui, -apple-system, sans-serif" font-size="13">Control de finanzas personales</text>
      <text x="24" y="112" fill="#8A8A94" font-family="system-ui, -apple-system, sans-serif" font-size="13">Presupuestos y gastos diarios</text>
      <rect x="24" y="135" width="76" height="22" rx="6" fill="#3B82F6" fill-opacity="0.12"/>
      <text x="34" y="150" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">FINANZAS</text>
    </g>
  </g>

  <!-- Footer Info -->
  <text x="80" y="550" fill="#8A8A94" font-family="monospace" font-size="13">lautaro005.github.io/tools</text>
  <text x="1120" y="550" text-anchor="end" fill="#8A8A94" font-family="monospace" font-size="13">OpenMaus Suite · 2025</text>
</svg>