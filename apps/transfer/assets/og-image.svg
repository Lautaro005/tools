      <stop offset="0%" stop-color="#D4A843" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0C0C0E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGradTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181D"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0C0C0E"/>
  <rect width="1200" height="630" fill="url(#glowTrans)"/>
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#1E1E24" stroke-width="2"/>
  
  <g transform="translate(80, 80)">
    <rect width="210" height="36" rx="18" fill="#141418" stroke="#D4A843" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="4" fill="#34D399"/>
    <text x="34" y="23" fill="#D4A843" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">P2P · AIRDROP &amp; QR</text>
  </g>

  <text x="80" y="200" fill="#F2F2F0" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">
