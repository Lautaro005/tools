      <rect x="160" y="0" width="165" height="26" rx="6" fill="#D4A843" fill-opacity="0.15"/>
      <text x="174" y="18" fill="#D4A843" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Multiarchivos</text>
      
      <rect x="340" y="0" width="175" height="26" rx="6" fill="#D4A843" fill-opacity="0.15"/>
