  <style>
    :root {
      --bg: #0C0C0E;
      --surface: #131316;
      --surface-hover: #18181D;
      --border: #1E1E24;
      --border-accent: rgba(212, 168, 67, 0.35);
      --text-primary: #F2F2F0;
      --text-secondary: #8A8A94;
      --accent: #D4A843;
      --accent-dim: rgba(212, 168, 67, 0.12);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse at center, rgba(212, 168, 67, 0.1) 0%, rgba(12, 12, 14, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .error-card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 36px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .badge-404 {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--accent-dim);
      border: 1px solid var(--border-accent);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Geist Mono', monospace;
      color: var(--accent);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #FFF;
    }

    p {
      color: var(--text-secondary);
      font-size: 14.5px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .redirect-notice {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 13px;
      font-family: 'Geist Mono', monospace;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    .redirect-notice span {
      color: var(--accent);
      font-weight: 600;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-primary {
      background: var(--accent);
      color: #0C0C0E;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: #E5B84D;
      transform: translateY(-1px);
    }

    .sub-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-secondary {
      background: var(--surface-hover);
      color: var(--text-primary);
      border: 1px solid var(--border);
      font-size: 12.5px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: var(--transition);
      flex: 1;
    }

    .btn-secondary:hover {
      border-color: var(--border-accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="error-card">
    <div class="badge-404">
      <span role="img" aria-label="Alerta">⚡</span> Error 404
    </div>
    <h1>Página no encontrada</h1>
    <p>
      El enlace solicitado no existe, cambió de ubicación o se ingresó una dirección incorrecta.
    </p>

    <div class="redirect-notice">
      Redirigiendo a Tools Suite en <span id="countdown">5</span>s...
    </div>

    <div class="actions">
      <a id="homeLink" href="./index.html" class="btn-primary">
        <span>⚡</span> Ir a Tools Suite ahora
      </a>
      <div class="sub-actions">
        <a id="codigosLink" href="./apps/codigos/index.html" class="btn-secondary">⚖️ Códigos AR</a>
        <a id="citasLink" href="./apps/citas/index.html" class="btn-secondary">📖 Citas APA</a>
      </div>
    </div>
  </div>

  <script>
    // Calcular ruta base adecuada dinámicamente según subcarpeta
    const path = window.location.pathname;
    let base = './';
    if (path.includes('/apps/')) {
      base = '../../';
    } else if (path.includes('/tools/')) {
      base = '/tools/';
    }

    const homeUrl = base + 'index.html';
    document.getElementById('homeLink').href = homeUrl;
    document.getElementById('codigosLink').href = base + 'apps/codigos/index.html';
    document.getElementById('citasLink').href = base + 'apps/citas/index.html';

    let seconds = 5;
    const countdownEl = document.getElementById('countdown');

    const timer = setInterval(() => {
      seconds--;
      if (countdownEl) countdownEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(homeUrl);
      }
    }, 1000);
  </script>
</body>
</html>
